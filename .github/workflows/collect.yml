name: pachislot-daily-collect

on:
  workflow_dispatch:        # 手動実行のみ（自動スケジュール無効: papimo.jpがGitHub Actions IPをブロック）

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python main.py

      - name: Commit updated DB and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pachislot.db reports/
          git diff --staged --quiet || git commit -m "auto: collect $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git push

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 7
